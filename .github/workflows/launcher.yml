name: Launcher

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  save-redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - run: make -C SaveRedirect test
      - run: make -C SaveRedirect
      - uses: actions/upload-artifact@v4
        with:
          name: dksign_saveredirect
          path: SaveRedirect/build/dksign_saveredirect.dll

  build:
    needs: save-redirect
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: dksign_saveredirect
          path: SaveRedirect/build
      - run: dotnet test Launcher/DarkSign.sln -c Release
      - run: >
          dotnet publish Launcher/src/DarkSign.Launcher -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -p:RequireRedirectDll=true -p:Version=${{ env.VERSION }} -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TheDarkSignLauncher
          path: publish
      # Each build of main becomes the release the launcher updates itself from.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gh release create "launcher-v${{ env.VERSION }}" publish/TheDarkSignLauncher.exe --title "Launcher v${{ env.VERSION }}" --notes "Built from ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
