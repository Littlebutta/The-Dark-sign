name: Launcher

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Launcher/DarkSign.sln -c Release
      - run: dotnet publish Launcher/src/DarkSign.Launcher -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TheDarkSignLauncher
          path: publish
