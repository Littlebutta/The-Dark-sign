name: Launcher

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

# A newer push to the same PR cancels the older run; main builds always finish so every release is made.
concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # The two DLLs only rebuild when their sources change; otherwise they come from the cache.
  save-redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: |
            SaveRedirect/build/dksign_saveredirect.dll
            TestMenu/build/dksign_testmenu.dll
          key: native-${{ hashFiles('SaveRedirect/**', 'TestMenu/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64)
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          make -C SaveRedirect test
          make -C TestMenu test
          make -j"$(nproc)" -C SaveRedirect
          make -j"$(nproc)" -C TestMenu
      - uses: actions/upload-artifact@v4
        with:
          name: dksign_saveredirect
          path: SaveRedirect/build/dksign_saveredirect.dll
      - uses: actions/upload-artifact@v4
        with:
          name: dksign_testmenu
          path: TestMenu/build/dksign_testmenu.dll

  # The launcher no longer waits for the porter: the two build side by side and a small job releases both.
  build:
    needs: [save-redirect]
    runs-on: windows-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      # The runner image already ships a .NET SDK that builds net8.0, so no SDK download.
      - run: dotnet --list-sdks
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-launcher-${{ hashFiles('Launcher/**/*.csproj') }}
          restore-keys: nuget-launcher-
      - uses: actions/download-artifact@v4
        with:
          name: dksign_saveredirect
          path: SaveRedirect/build
      - uses: actions/download-artifact@v4
        with:
          name: dksign_testmenu
          path: TestMenu/build
      - run: dotnet test Launcher/DarkSign.sln -c Release
      - run: >
          dotnet publish Launcher/src/DarkSign.Launcher -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none -p:RequireRedirectDll=true -p:Version=${{ env.VERSION }} -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TheDarkSignLauncher
          path: publish

  # The porter only rebuilds when Porter/ or DarkSign.Core changes; otherwise the last zip is reused.
  porter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: cache
        uses: actions/cache@v4
        with:
          path: DarkSignPorter.zip
          key: porter-${{ hashFiles('Porter/**', 'Launcher/src/DarkSign.Core/**', 'Randomizer/src/**', 'Randomizer/data/**') }}
      # SoulsFormatsNEXT needs C# 13, so the porter builds with SDK 9+ while still targeting net8.0.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet --list-sdks
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-porter-${{ hashFiles('Porter/**/*.csproj', 'Launcher/src/DarkSign.Core/*.csproj', 'Randomizer/src/**/*.csproj') }}
          restore-keys: nuget-porter-
      # The launcher downloads this zip from the release it was built with and runs it to build the content mod.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: dotnet publish Porter/src/DarkSign.Porter -c Release -r win-x64 --self-contained false -o porter-publish
      # Offline checks of the map porter (collision conversion, layouts, run events); no game files needed.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe map-selftest
      # Offline checks of the sound bank layout ported sounds get (no game files needed).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe sound-selftest
      # Offline checks that ported moves' combo/cancel windows don't cut DS3 swings short (no game files needed).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe timing-selftest
      # Offline checks of the DS3 reflectance -> Elden Ring metallic weapon texture conversion (no game files needed).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe texture-selftest
      # Offline checks of the enemy porter (templates, IDs, skin indices, chr map, TAE merge; no game files needed).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe enemy-selftest
      # Offline checks of the weapon art port (hks patch, skill names; no game files needed).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe arts-selftest
      # Offline checks of how the behaviour's animation IDs are shared out among the ported movesets (no game files needed).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe moveset-selftest
      # Offline checks of the bone retargeting (rest-pose corrections: the off-hand weapon's orientation) and the spline rotation rewrite (no game files needed).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe anim-selftest
      # Offline checks of the effect visual, bullet and resident effect ports (params built in memory).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe effects-selftest
      # The randomizer's data ships with the porter: make one checked world in a scratch root (no game files needed).
      - if: steps.cache.outputs.cache-hit != 'true'
        run: porter-publish/DarkSignPorter.exe --root "$env:RUNNER_TEMP\rando-smoke" randomize --profile CI --seed 1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: Compress-Archive -Path porter-publish/* -DestinationPath DarkSignPorter.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DarkSignPorter
          path: DarkSignPorter.zip

  # Each build of main becomes the release the launcher updates itself from.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, porter]
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TheDarkSignLauncher
          path: publish
      - uses: actions/download-artifact@v4
        with:
          name: DarkSignPorter
          path: porter
      - run: gh release create "launcher-v${{ env.VERSION }}" publish/TheDarkSignLauncher.exe porter/DarkSignPorter.zip --repo "${{ github.repository }}" --title "Launcher v${{ env.VERSION }}" --notes "Built from ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
