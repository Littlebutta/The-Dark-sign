# Elden Ring's world for the cross-game randomizer, written for The Dark Sign (our own data).
#
# Same layout as FogMod's DS3 file (Areas with To, KeyItems, Entrances) plus: Tier (0 = start, 1 = end), Regions /
# Maps / Graces (how the porter puts each item location in an area), Groups (named lists used as "@name" in
# conditions), Bosses and Dungeons.
#
# Rule for this file: when unsure whether a route exists without a key or boss, require it. Stricter logic can only
# make the randomizer place items earlier than needed; looser logic could make a seed unbeatable.
#
# Elden Ring lets you warp to any discovered Site of Grace from anywhere outside a boss fight, so the logic never
# needs a way back: anywhere you have reached stays reachable.
#
# Names in the game text (Regions, Graces, key item Text, boss Text) are looked up in the game's own text by the
# porter on the player's PC; anything it can't find is reported and left vanilla.

Start: chapel

Groups:
  # Great Rune bearers. Leyndell's gate needs two of them (Rennala's Great Rune of the Unborn doesn't count).
  # With "shared shards" on, the randomizer replaces this list with both games' shardbearers (DS3 Lords of Cinder too).
  shards: [stormveil_godrick, caelid_radahn, volcano_rykard, haligtree_malenia, mohgwyn_mohg, leyndell_morgott]

